name: Build DSH Go APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'site/**'
      - 'infra/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Firebase/Google 官方源在 Actions（美国）上最快；国内镜像留给本地构建用。
      FLUTTER_BASE_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      PUB_HOSTED_URL: https://pub.dev
      # runtime/build-runtime.sh 支持用环境变量换镜像；Actions 上直连官方源更稳。
      NODE_MIRROR: https://nodejs.org/dist
      NPM_REGISTRY: https://registry.npmjs.org
      UBUNTU_MIRROR: https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release
      UBUNTU_ARCHIVE_AMD64: https://archive.ubuntu.com/ubuntu
      UBUNTU_ARCHIVE_ARM64: https://ports.ubuntu.com/ubuntu-ports
      # 真机包不需要模拟器镜像（省 1–2 GB 和几分钟）。
      SKIP_EMULATOR: "1"
      # 官方 gradle 默认先走 aliyun 镜像；从美国 runner 访问会 502，CI 用官方仓库。
      DSH_MAVEN_MIRRORS: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Restore the runtime download cache
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-cache-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-cache-v1-
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Write the signing key
        env:
          KEYSTORE_B64: ${{ secrets.DSH_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DSH_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DSH_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > app/android/dshgo-release.p12
            # storeFile 相对 app/android/app 解析，这里直接写绝对路径。
            printf 'storeFile=%s/app/android/dshgo-release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$GITHUB_WORKSPACE" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > app/android/key.properties
            echo "release key configured"
          else
            echo "no signing key secret; falling back to debug key" >&2
          fi
      - name: Set up toolchain
        run: |
          set -o pipefail
          bash -x tooling/setup-toolchain.sh 2>&1 | tail -150
      - name: Check NDK (diagnostic)
        run: |
          source tooling/env.sh
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d "$ANDROID_HOME"/ndk/* || true
          for f in "$ANDROID_HOME"/ndk/*/source.properties; do
            echo "== $f"; cat "$f" || true
          done
      - name: Build runtime (arm64)
        run: |
          source tooling/env.sh
          bash runtime/build-runtime.sh arm64-v8a
      - name: Build APK (arm64)
        run: |
          source tooling/env.sh
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --no-companion --keep-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
